x-app-env: &app-env
  APP_ENVIRONMENT: development
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317

x-db-env: &db-env
  DB_HOST: mysql
  DB_PORT: "3306"
  DB_USERNAME: exchange
  DB_PASSWORD: exchange123
  DB_DATABASE: exchange

x-grpc-env: &grpc-env
  USER_GRPC_ADDR: user-svc:50051
  ORDER_GRPC_ADDR: order-svc:50052
  MATCHING_GRPC_ADDR: matching-svc:50053

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: exchange
      MYSQL_USER: exchange
      MYSQL_PASSWORD: exchange123
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./migrations:/docker-entrypoint-initdb.d:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD-SHELL", 'MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --protocol=tcp -h 127.0.0.1 -u "$${MYSQL_USER}" "$${MYSQL_DATABASE}" -e "SELECT 1 FROM orders LIMIT 0"']
      interval: 5s
      timeout: 3s
      start_period: 20s
      retries: 12
    networks: [exchange-network]

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks: [exchange-network]

  jaeger:
    image: jaegertracing/all-in-one:1.52
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    networks: [exchange-network]

  gateway:
    build:
      context: .
      target: gateway
    environment:
      <<: [*app-env, *grpc-env]
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      JWT_SECRET: dev-secret-key-change-in-production
      SERVER_PORT: "8080"
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy
      user-svc:
        condition: service_healthy
      order-svc:
        condition: service_healthy
      matching-svc:
        condition: service_healthy
    networks: [exchange-network]

  user-svc:
    build:
      context: .
      target: user-svc
    environment:
      <<: [*app-env, *db-env]
    depends_on:
      mysql:
        condition: service_healthy
    networks: [exchange-network]

  order-svc:
    build:
      context: .
      target: order-svc
    environment:
      <<: [*app-env, *db-env, *grpc-env]
    depends_on:
      mysql:
        condition: service_healthy
      user-svc:
        condition: service_healthy
      matching-svc:
        condition: service_healthy
    networks: [exchange-network]

  matching-svc:
    build:
      context: .
      target: matching-svc
    environment:
      <<: *app-env
      WAL_DIR: /data/wal
      SNAPSHOT_DIR: /data/snapshot
    volumes:
      - matching_data:/data
    networks: [exchange-network]

  demo-seed:
    profiles: [demo]
    build: {context: ., target: demo-seed}
    environment:
      <<: [*app-env, *db-env, *grpc-env]
    restart: "no"
    depends_on:
      mysql:
        condition: service_healthy
      user-svc:
        condition: service_healthy
      order-svc:
        condition: service_healthy
      matching-svc:
        condition: service_healthy
    networks: [exchange-network]

  web:
    profiles: [demo]
    build: ./web
    ports: ["8088:80"]
    depends_on:
      gateway:
        condition: service_healthy
      demo-seed:
        condition: service_completed_successfully
    networks: [exchange-network]

volumes:
  mysql_data:
  redis_data:
  matching_data:

networks:
  exchange-network:
    driver: bridge
