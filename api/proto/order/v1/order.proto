syntax = "proto3";

package order.v1;

option go_package = "github.com/linxun2025/exchange-project/api/gen/order/v1;orderpb";

import "google/protobuf/timestamp.proto";

service OrderService {
  rpc CreateOrder(CreateOrderRequest) returns (CreateOrderResponse);
  rpc CancelOrder(CancelOrderRequest) returns (CancelOrderResponse);
  rpc GetOrder(GetOrderRequest) returns (GetOrderResponse);
  rpc ListOrders(ListOrdersRequest) returns (ListOrdersResponse);
  rpc ListTrades(ListTradesRequest) returns (ListTradesResponse);
}

enum OrderSide {
  ORDER_SIDE_UNSPECIFIED = 0;
  ORDER_SIDE_BUY = 1;
  ORDER_SIDE_SELL = 2;
}

enum OrderType {
  ORDER_TYPE_UNSPECIFIED = 0;
  ORDER_TYPE_LIMIT = 1;
  ORDER_TYPE_MARKET = 2;
  ORDER_TYPE_IOC = 3;
  ORDER_TYPE_FOK = 4;
}

enum OrderStatus {
  ORDER_STATUS_UNSPECIFIED = 0;
  ORDER_STATUS_PENDING = 1;
  ORDER_STATUS_OPEN = 2;
  ORDER_STATUS_PARTIAL_FILLED = 3;
  ORDER_STATUS_FILLED = 4;
  ORDER_STATUS_CANCELLED = 5;
  ORDER_STATUS_REJECTED = 6;
}

message Order {
  string order_id = 1;
  int64 user_id = 2;
  string symbol = 3;
  OrderSide side = 4;
  OrderType type = 5;
  string price = 6;
  string quantity = 7;
  string filled_quantity = 8;
  OrderStatus status = 9;
  string reject_reason = 10;
  bool cancel_requested = 11;
  google.protobuf.Timestamp created_at = 12;
  google.protobuf.Timestamp updated_at = 13;
}

message CreateOrderRequest {
  int64 user_id = 1;
  string symbol = 2;
  OrderSide side = 3;
  OrderType type = 4;
  string price = 5;
  string quantity = 6;
  string idempotency_key = 7;
}

message CreateOrderResponse {
  Order order = 1;
  bool replayed = 2;
}

message CancelOrderRequest {
  int64 user_id = 1;
  string order_id = 2;
}

message CancelOrderResponse {
  Order order = 1;
}

message GetOrderRequest {
  int64 user_id = 1;
  string order_id = 2;
}

message GetOrderResponse {
  Order order = 1;
}

message ListOrdersRequest {
  int64 user_id = 1;
  string symbol = 2;
  // UNSPECIFIED 表示不过滤状态。
  OrderStatus status = 3;
  // 默认 50，最大 200。
  int32 page_size = 4;
  // 上一页返回的不透明游标。
  string page_token = 5;
}

message ListOrdersResponse {
  repeated Order orders = 1;
  string next_page_token = 2;
}

// 请求用户视角的成交记录。
message Trade {
  string trade_id = 1;
  string symbol = 2;
  string order_id = 3;
  OrderSide side = 4;
  string price = 5;
  string quantity = 6;
  bool maker = 7;
  google.protobuf.Timestamp created_at = 8;
}

message ListTradesRequest {
  int64 user_id = 1;
  string symbol = 2;
  // 默认 50，最大 200。
  int32 page_size = 3;
  // 上一页返回的不透明游标。
  string page_token = 4;
}

message ListTradesResponse {
  repeated Trade trades = 1;
  string next_page_token = 2;
}
