syntax = "proto3";

package user.v1;

option go_package = "github.com/linxun2025/exchange-project/api/gen/user/v1;userpb";

import "google/protobuf/timestamp.proto";

service UserService {
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc GetUser(GetUserRequest) returns (GetUserResponse);
  rpc GetBalances(GetBalancesRequest) returns (GetBalancesResponse);
  rpc Deposit(DepositRequest) returns (DepositResponse);
  rpc Freeze(FreezeRequest) returns (FreezeResponse);
  rpc Unfreeze(UnfreezeRequest) returns (UnfreezeResponse);
  rpc SettleTrade(SettleTradeRequest) returns (SettleTradeResponse);
}

message User {
  int64 id = 1;
  string username = 2;
  string email = 3;
  int32 status = 4;
  google.protobuf.Timestamp created_at = 5;
}

message CreateUserRequest {
  string username = 1;
  string password = 2;
  string email = 3;
}

message CreateUserResponse {
  User user = 1;
}

message LoginRequest {
  string username = 1;
  string password = 2;
}

message LoginResponse {
  int64 user_id = 1;
  string username = 2;
  string role = 3;
}

message GetUserRequest {
  int64 user_id = 1;
}

message GetUserResponse {
  User user = 1;
}

message Balance {
  string asset = 1;
  string available = 2;
  string frozen = 3;
}

message GetBalancesRequest {
  int64 user_id = 1;
}

message GetBalancesResponse {
  repeated Balance balances = 1;
}

message DepositRequest {
  int64 user_id = 1;
  string asset = 2;
  string amount = 3;
  string ref_id = 4;
}

message DepositResponse {
  Balance balance = 1;
}

message FreezeRequest {
  int64 user_id = 1;
  string asset = 2;
  string amount = 3;
  string order_id = 4;
}

message FreezeResponse {
  bool ok = 1;
  // ok=false 时为 "insufficient_balance"。
  string reason = 2;
}

message UnfreezeRequest {
  int64 user_id = 1;
  string asset = 2;
  string amount = 3;
  string order_id = 4;
}

message UnfreezeResponse {}

message SettleTradeRequest {
  string trade_id = 1;
  string base_asset = 2;
  string quote_asset = 3;
  int64 buy_user_id = 4;
  int64 sell_user_id = 5;
  string price = 6;
  string quantity = 7;
  string buy_order_price = 8;
}

message SettleTradeResponse {}
