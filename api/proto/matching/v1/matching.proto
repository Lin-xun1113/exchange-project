syntax = "proto3";

package matching.v1;

option go_package = "github.com/linxun2025/exchange-project/api/gen/matching/v1;matchingpb";

import "google/protobuf/timestamp.proto";

service MatchingService {
  // 结果保留期间，同一 order_id 重试返回首次结果（含相同成交列表）。
  rpc SubmitOrder(SubmitOrderRequest) returns (SubmitOrderResponse);
  // 结果保留期间，重复撤销已撤订单返回首次结果且不再写 WAL。
  rpc CancelOrder(CancelOrderRequest) returns (CancelOrderResponse);
  rpc GetOrderBook(GetOrderBookRequest) returns (GetOrderBookResponse);
}

enum OrderSide {
  ORDER_SIDE_UNSPECIFIED = 0;
  ORDER_SIDE_BUY = 1;
  ORDER_SIDE_SELL = 2;
}

enum OrderType {
  ORDER_TYPE_UNSPECIFIED = 0;
  ORDER_TYPE_LIMIT = 1;
  ORDER_TYPE_MARKET = 2;
  ORDER_TYPE_IOC = 3;
  ORDER_TYPE_FOK = 4;
}

enum RejectReason {
  REJECT_REASON_NONE = 0;
  REJECT_REASON_FOK_UNFILLED = 1;
  // 市价卖单无对手时零成交。
  REJECT_REASON_NO_LIQUIDITY = 2;
}

message Trade {
  string trade_id = 1;
  string symbol = 2;
  string buy_order_id = 3;
  string sell_order_id = 4;
  int64 buy_user_id = 5;
  int64 sell_user_id = 6;
  string price = 7;
  string quantity = 8;
  OrderSide taker_side = 9;
  uint64 lsn = 10;
  google.protobuf.Timestamp created_at = 11;
}

message SubmitOrderRequest {
  string order_id = 1;
  int64 user_id = 2;
  string symbol = 3;
  OrderSide side = 4;
  OrderType type = 5;
  string price = 6;
  string quantity = 7;
}

message SubmitOrderResponse {
  string order_id = 1;
  repeated Trade trades = 2;
  // 本单累计成交数量。
  string filled_quantity = 3;
  // 本单未成交数量。
  string remaining_quantity = 4;
  // 余量仍挂在订单簿上。
  bool resting = 5;
  RejectReason reject_reason = 6;
}

message CancelOrderRequest {
  string symbol = 1;
  string order_id = 2;
}

message CancelOrderResponse {
  // 订单不在簿上且无已撤结果时为 false。已撤订单重试返回 true 及首次撤销的余量。
  bool found = 1;
  string remaining_quantity = 2;
}

message PriceLevel {
  string price = 1;
  string quantity = 2;
  int32 order_count = 3;
}

message GetOrderBookRequest {
  string symbol = 1;
  // 取值 1..200，0 视为 20。
  int32 depth = 2;
}

message GetOrderBookResponse {
  string symbol = 1;
  repeated PriceLevel bids = 2;
  repeated PriceLevel asks = 3;
  uint64 lsn = 4;
}
